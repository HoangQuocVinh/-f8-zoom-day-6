<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Layout</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container-register">
      <div class="form-register">
        <div>
          <h1 style="font-size: 1.2rem; font-weight: 500">Register</h1>
          <p style="font-size: 0.7rem; font-weight: 100">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Qui,
            saepe?
          </p>
        </div>
        <form action="">
          <div class="manager-input">
            <input type="text" class="register-input" placeholder="Email" />
            <input type="text" class="register-input" placeholder="Password" />
            <input
              type="text"
              class="register-input"
              placeholder="Re-type Password"
            />
          </div>
          <label for="">
            <input type="checkbox" />
            Agree our Tém and Conditions
          </label>
          <button>Register</button>
        </form>
        <span style="font-size: 0.7rem; font-weight: 100">-or-</span>
        <label class="my-submit">
          <i class="fa-brands fa-facebook-f"></i>
          <input type="submit" value="Register with Facebook" />
        </label>
        <label class="my-submit" style="background-color: #4ba1ea">
          <i class="fa-brands fa-twitter"></i>
          <input
            type="submit"
            value="Register with Twitter"
            style="background-color: #4ba1ea"
          />
        </label>
        <label class="my-submit" style="background-color: red">
          <i class="fa-brands fa-google"></i>
          <input
            type="submit"
            value="Register with Google"
            style="background-color: red"
          />
        </label>
      </div>
      <div class="register-img">
        <img
          src="https://doanhnhanplus.vn/wp-content/uploads/2018/01/DN-40-buc-anh-dep-nhat-the-gioi-2017-Tin-020118-1.jpg"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
